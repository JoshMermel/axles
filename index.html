<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axle Puzzle</title>
<meta name="description" content="Turn every arrow to point up, but a square can't turn while a neighbor's dot points at it. A logic puzzle on square or hex boards.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-0.7 -0.7 1.4 1.4'%3E%3Crect x='-0.7' y='-0.7' width='1.4' height='1.4' rx='0.25' fill='%23b0e0b0'/%3E%3Cpath d='M0,-0.5 L0.24,-0.12 H0.09 V0.4 H-0.09 V-0.12 H-0.24 Z' fill='%23111'/%3E%3C/svg%3E">

<style>
* {
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Roboto', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #f0f0f0;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
}

#app {
  background-color: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  text-align: center;
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

h1 {
  color: #333;
  margin: 0 0 20px;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid #008CBA;
  outline-offset: 2px;
}

/* ---------- Header + help button ---------- */

#header {
  position: relative;
}

#help-button {
  position: absolute;
  top: 0;
  right: 0;
  width: 36px;
  height: 36px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background-color: #e0e0e0;
  color: #333;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

#help-button:hover {
  background-color: #ccc;
}

/* ---------- Board ---------- */

/* Cells shrink on narrow screens so a 6-wide board never overflows.
   80px (body padding + app padding) is the horizontal space not available to cells. */
#puzzle-box {
  --cell: min(80px, calc((100vw - 80px) / var(--cols, 4)));
  display: grid;
  justify-content: center;
  align-items: center;
}

.axle-row {
  display: flex;
}

.axle-button {
  width: var(--cell, 80px);
  height: var(--cell, 80px);
  cursor: pointer;
  border: 2px solid black;
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
  background-color: #e0e0e0;
  position: relative;
  padding: 0;
}

.axle-blocked {
  background-color: #e0e0e0;
}

.axle-unblocked {
  background-color: #b0e0b0;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: black;
  position: absolute;
}

.dot-up        { top: 4px;    left: 50%; transform: translateX(-50%); }
.dot-upright   { top: 4px;    right: 4px; }
.dot-right     { top: 50%;    right: 4px; transform: translateY(-50%); }
.dot-downright { bottom: 4px; right: 4px; }
.dot-down      { bottom: 4px; left: 50%; transform: translateX(-50%); }
.dot-downleft  { bottom: 4px; left: 4px; }
.dot-left      { top: 50%;    left: 4px; transform: translateY(-50%); }
.dot-upleft    { top: 4px;    left: 4px; }

/* The arrow on every cell, square or hex. */
.arrow-shape { fill: #111; }

.axle-button > svg {
  width: 68%;
  height: 68%;
  pointer-events: none;
}

/* ---------- Controls ---------- */

#game-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}

#new-game-button {
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  background-color: #008CBA;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  margin-bottom: 10px;
}

#new-game-button:hover {
  background-color: #006f94;
}

#message-box {
  margin-top: 20px;
  color: #222;
  font-size: 16px;
  padding: 10px;
  min-height: 1.4em;
  border: 1px solid #ddd;
  border-radius: 5px;
  background-color: #f9f9f9;
}

#row-col-inputs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px 20px;
  margin-bottom: 20px;
}

#row-col-inputs input {
  width: 50px;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 16px;
  text-align: center;
}

#footer {
  margin-top: auto;
  text-align: center;
  font-size: 0.8em;
  color: #888;
  padding-top: 10px;

#mode-selection button:hover {

}

#mode-selection button.selected {
  background-color: #4CAF50;

}

.input-group {
  display: flex;
  align-items: center;
  gap: 5px;
}

.size-button {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: none;
  background-color: #ddd;
  color: #333;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
}

.size-button:hover {
  background-color: #ccc;
}

.size-button:disabled {
  background-color: #eee;
  color: #aaa;
  cursor: not-allowed;

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button {

.cell-count {

#hex-box {

.hex { cursor: pointer; outline: none; }
.hex.static { cursor: default; }
.hex polygon { stroke: #000; stroke-width: 2; stroke-linejoin: round; }
.hex.free polygon { fill: #b0e0b0; }
.hex.blocked polygon { fill: #e0e0e0; }
.hex:focus-visible polygon { stroke: #008CBA; stroke-width: 4; }
.hex-dot { fill: #000; }

.help-example svg {
  width: 110px;
  flex-shrink: 0;
}

/* ---------- Help modal (native <dialog>) ---------- */

#help-modal {
  border: none;
  border-radius: 16px;
  padding: 0;
  width: min(440px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  color: #333;
  text-align: left;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
}

#help-modal[open] {
  animation: modal-in 0.18s ease-out;
}

#help-modal::backdrop {
  background: rgba(20, 20, 30, 0.5);
}

  animation: backdrop-in 0.18s ease-out;
}

@keyframes modal-in {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

@keyframes backdrop-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  #help-modal[open],
  #help-modal[open]::backdrop {
    animation: none;
  }

.modal-content {

.modal-header {

  align-items: center;

.modal-header h2 {
  margin: 0;
  font-size: 22px;

#help-close {
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #eee;
  color: #333;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;

.help-rules li {

.help-example {

.help-example .axle-row {

  flex-shrink: 0;

.help-example .axle-button {

.help-example p {

.legend-swatch {

  height: 0.9em;

  border-radius: 3px;

.legend-swatch.free    { background: #b0e0b0; }
.legend-swatch.blocked { background: #e0e0e0; }

#help-ok {
  display: block;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background-color: #008CBA;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#help-ok:hover {
  background-color: #006f94;
}

<body>
  <div id="app"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { createRoot } = ReactDOM;

const HELP_SEEN_KEY = 'axle-puzzle-help-seen';
const MIN_SIZE = 2;
const MAX_SIZE = 6;

// [name, dr, dc] for each direction, clockwise from straight up. These are the
// indices into Axle.blocks; opposite directions are always 4 apart.
const DIRECTION_INFO = [
  ['up',        -1,  0],
  ['upright',   -1,  1],
  ['right',      0,  1],
  ['downright',  1,  1],
  ['down',       1,  0],
  ['downleft',   1, -1],
  ['left',       0, -1],
  ['upleft',    -1, -1],
];

class Axle {
  constructor(orientation, blocks) {
    this.orientation = orientation;
    this.blocks = blocks;
  }

  // Turning clockwise by `steps` quarter turns moves the dot at direction d
  // to direction (d + 2*steps) % 8.
  rotated(steps) {
    const shift = 2 * steps;
    const newBlocks = new Array(8);
    for (let d = 0; d < 8; d++) {
      newBlocks[(d + shift) % 8] = this.blocks[d];
    }
    return new Axle((this.orientation + steps) % 4, newBlocks);
  }

  rotatedClockwise() { return this.rotated(1); }

  blocksDirection(direction) {
    return this.blocks[direction];
  }

  rotateRandomly() {
    return this.rotated(1 + Math.floor(Math.random() * 3));
  }
}

// Assigns each axle a random (unique) number, and only allows blocking from
// higher number to lower numbers. This prevents cycles of blockage when
// generating random puzzles.
class TopoWeight {
  constructor(rows, cols, mode) {
    this.rows = rows;
    this.cols = cols;
    switch (mode) {
      case 'easy':
        this.cardinal_probability = 0.4;
        this.diagonal_probability = 0;
        break;
      case 'hard':
        this.cardinal_probability = 0.6;
        this.diagonal_probability = 0.35;
        break;
      case 'normal':
      default:
        this.cardinal_probability = 0.75;
        this.diagonal_probability = 0;
        break;
    }
    this.oob = rows * cols / 4;
    this.grid = Array.from({ length: rows * cols }, (_, i) => i);
    let currentIndex = rows * cols;
    while (currentIndex != 0) {
      let randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [this.grid[currentIndex], this.grid[randomIndex]] = [this.grid[randomIndex], this.grid[currentIndex]];
    }
  }

  get(r, c) {
    if (r < this.rows && c < this.cols && r >= 0 && c >= 0) {
      return this.grid[r * this.cols + c];
    }
    // Adding a blocker pointed out-of-bounds never causes cycles, but we don't
    // want to do it too much.
    return this.oob;
  }

  shouldBlock(r1, c1, r2, c2, probability) {
    if (this.get(r1, c1) < this.get(r2, c2)) {
      return false;
    }
    return Math.random() < probability;
  }

  blockers(r,c) {
    let cardinals = [
        this.shouldBlock(r, c, r-1, c, this.cardinal_probability),
        this.shouldBlock(r, c, r, c+1, this.cardinal_probability),
        this.shouldBlock(r, c, r+1, c, this.cardinal_probability),
        this.shouldBlock(r, c, r, c-1, this.cardinal_probability),
    ];
    // A fully-symmetric axle would look identical after any rotation.
    if (cardinals.every(v => v === true)) {
      cardinals[0] = false;
    }

    let diagonals = [
      this.shouldBlock(r, c, r-1, c+1, this.diagonal_probability),
      this.shouldBlock(r, c, r+1, c+1, this.diagonal_probability),
      this.shouldBlock(r, c, r+1, c-1, this.diagonal_probability),
      this.shouldBlock(r, c, r-1, c-1, this.diagonal_probability),
    ];
    if (diagonals.every(v => v === true)) {
      diagonals[0] = false;
    }

    return [
      cardinals[0], diagonals[0],
      cardinals[1], diagonals[1],
      cardinals[2], diagonals[2],
      cardinals[3], diagonals[3]
    ];
  }
}

class PuzzleState {
  constructor(rows, cols, grid) {
    this.rows = rows;
    this.cols = cols;
    this.grid = grid;
  }

  inBounds(r, c) {
    return r >= 0 && r < this.rows && c >= 0 && c < this.cols;
  }

  getAxle(r, c) {
    return this.inBounds(r, c) ? this.grid[r * this.cols + c] : null;
  }

  setAxle(r, c, axle) {
    if (this.inBounds(r, c)) {
      this.grid[r * this.cols + c] = axle;
    }
  }

  // An axle can turn unless some neighbor has a dot pointing at it.
  canRotate(r, c) {
    for (let d = 0; d < 8; d++) {
      const nr = r + DIRECTION_INFO[d][1];
      const nc = c + DIRECTION_INFO[d][2];
      if (this.inBounds(nr, nc) && this.getAxle(nr, nc).blocksDirection((d + 4) % 8)) {
        return false;
      }
    }
    return true;
  }

  getRotatableAxles() {
    const rotatableAxles = [];
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (this.canRotate(r, c)) {
          rotatableAxles.push({ row: r, col: c });
        }
      }
    }
    return rotatableAxles;
  }

  // Random walk of legal moves. Every move is reversible (an axle's
  // blockedness depends only on its neighbors, which a move doesn't change),
  // so any state reached this way can be solved by undoing the walk.
  shuffle() {
    for (let i = 0; i < 100 * this.rows * this.cols; i++) {
      const rotatableAxles = this.getRotatableAxles();
      if (rotatableAxles.length === 0) {
        return;
      }
      const { row, col } = rotatableAxles[Math.floor(Math.random() * rotatableAxles.length)];
      this.setAxle(row, col, this.getAxle(row, col).rotateRandomly());
    }
  }

  clone() {
    const newGrid = this.grid.map(axle => new Axle(axle.orientation, [...axle.blocks]));
    return new PuzzleState(this.rows, this.cols, newGrid);
  }

  isSolved() {
    return this.grid.every((axle) => axle.orientation === 0);
  }
}

function generateRandomState(rows, cols, mode) {
  for (;;) {
    const topo_weights = new TopoWeight(rows, cols, mode);
    const grid = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        grid.push(new Axle(0, topo_weights.blockers(r, c)));
      }
    }
    const puzzle = new PuzzleState(rows, cols, grid);

    // The first shuffle scrambles the dot pattern so the solved position isn't
    // the (acyclic) one we generated; then we declare the scrambled pattern
    // "solved" by zeroing orientations, and shuffle again to make the puzzle.
    puzzle.shuffle();
    for (const axle of puzzle.grid) {
      axle.orientation = 0;
    }
    puzzle.shuffle();

    if (!puzzle.isSolved()) {
      return puzzle;
    }
  }
}

// ---------- Hex grid ----------
// Flat-top hexes in axial coordinates (q = column, r = row slanting down-right).
// Direction i points 60*i degrees clockwise from straight up, so an arrow with
// orientation 0 points at the top edge, orientation 1 at the upper-right edge...
//                       N       NE      SE      S       SW      NW
const HEX_DIRS = [[0, -1], [1, -1], [1, 0], [0, 1], [-1, 1], [-1, 0]];
const HEX_SIDES = 6;
const hexOpposite = (d) => (d + 3) % HEX_SIDES;

const MIN_RADIUS = 1;
const MAX_RADIUS = 3;
const DEFAULT_RADIUS = 2;
const hexCellCount = (radius) => 3 * radius * (radius + 1) + 1;

// Per-direction chance of a dot (only toward lower-weight neighbors). Tuned so
// the share of free cells roughly matches the square grid: ~55% / ~34% / ~30%.
const HEX_MODE_PROBABILITY = { easy: 0.25, normal: 0.5, hard: 0.6 };

class HexAxle {
  constructor(orientation, blocks) {
    this.orientation = orientation;
    this.blocks = blocks;
  }

  // Turning clockwise by `steps` sixths of a turn moves the dot at direction d
  // to direction (d + steps) % 6.
  rotated(steps) {
    const newBlocks = new Array(HEX_SIDES);
    for (let d = 0; d < HEX_SIDES; d++) {
      newBlocks[(d + steps) % HEX_SIDES] = this.blocks[d];
    }
    return new HexAxle((this.orientation + steps) % HEX_SIDES, newBlocks);
  }

  rotatedClockwise() { return this.rotated(1); }

  rotateRandomly() {
    return this.rotated(1 + Math.floor(Math.random() * (HEX_SIDES - 1)));
  }
}

// A hexagon-shaped board with `radius` rings around the center cell.
class HexBoard {
  constructor(radius, grid) {
    this.radius = radius;
    this.cells = [];          // [{q, r}] in a stable order
    this.index = new Map();   // "q,r" -> position in this.cells
    for (let r = -radius; r <= radius; r++) {
      for (let q = -radius; q <= radius; q++) {
        if (Math.abs(q + r) <= radius) {
          this.index.set(`${q},${r}`, this.cells.length);
          this.cells.push({ q, r });
        }
      }
    }
    this.grid = grid;
  }

  // Index of the neighbor of cell i in direction d, or -1 if off the board.
  neighbor(i, d) {
    const { q, r } = this.cells[i];
    const n = this.index.get(`${q + HEX_DIRS[d][0]},${r + HEX_DIRS[d][1]}`);
    return n === undefined ? -1 : n;
  }

  // An axle can turn unless some neighbor has a dot pointing at it.
  canRotate(i) {
    for (let d = 0; d < HEX_SIDES; d++) {
      const n = this.neighbor(i, d);
      if (n >= 0 && this.grid[n].blocks[hexOpposite(d)]) {
        return false;
      }
    }
    return true;
  }

  // Random walk of legal moves. Moves are reversible (blockedness of an axle
  // depends only on its neighbors), so every state reached is solvable.
  shuffle() {
    for (let step = 0; step < 100 * this.cells.length; step++) {
      const movable = [];
      for (let i = 0; i < this.cells.length; i++) {
        if (this.canRotate(i)) movable.push(i);
      }
      if (movable.length === 0) return;
      const i = movable[Math.floor(Math.random() * movable.length)];
      this.grid[i] = this.grid[i].rotateRandomly();
    }
  }

  clone() {
    return new HexBoard(this.radius, this.grid.map(a => new HexAxle(a.orientation, [...a.blocks])));
  }

  isSolved() {
    return this.grid.every(a => a.orientation === 0);
  }
}

// Random dots such that blocking can't form a cycle: each cell gets a unique
// random weight and may only block neighbors of lower weight.
function randomHexBlocks(board, mode) {
  const n = board.cells.length;
  const weight = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [weight[i], weight[j]] = [weight[j], weight[i]];
  }
  const oob = n / 4;  // off-board targets never cause cycles; don't use them too much
  const p = HEX_MODE_PROBABILITY[mode] ?? HEX_MODE_PROBABILITY.normal;

  return board.cells.map((_, i) => {
    const blocks = [];
    for (let d = 0; d < HEX_SIDES; d++) {
      const nb = board.neighbor(i, d);
      const target = nb >= 0 ? weight[nb] : oob;
      blocks.push(weight[i] >= target && Math.random() < p);
    }
    // A fully-symmetric axle would look the same after any turn.
    if (blocks.every(b => b)) blocks[0] = false;
    return new HexAxle(0, blocks);
  });
}

function generateHexState(radius, mode) {
  for (;;) {
    const board = new HexBoard(radius, []);
    board.grid = randomHexBlocks(board, mode);

    // Same two-step scramble as the square grid (see generateRandomState).
    board.shuffle();
    for (const axle of board.grid) axle.orientation = 0;
    board.shuffle();

    if (!board.isSolved()) return board;
  }
}

// ---------- UI ----------

// ---------- Arrow (shared by both boards) ----------

// An arrow pointing straight up, in unit coordinates centered on the origin.
const ARROW_UNIT_PATH = 'M0,-0.5 L0.24,-0.12 H0.09 V0.4 H-0.09 V-0.12 H-0.24 Z';

// Square-board arrow: an SVG that fills the cell's content area and turns in
// 90-degree steps. (Hex cells draw the same path directly; see HexCell.)
function SquareArrow({ orientation }) {
  return (
    <svg viewBox="-0.6 -0.6 1.2 1.2" aria-hidden="true">
      <path className="arrow-shape" d={ARROW_UNIT_PATH} transform={`rotate(${orientation * 90})`} />
    </svg>
  );
}

// ---------- Hex rendering ----------

const HEX_S = 40;            // hex circumradius in SVG units
const HEX_GAP = 0.94;        // draw hexes slightly smaller than the cell for a gutter
const SQRT3 = Math.sqrt(3);

const HEX_POINTS = [0, 1, 2, 3, 4, 5]
  .map(k => [HEX_S * HEX_GAP * Math.cos(k * Math.PI / 3), HEX_S * HEX_GAP * Math.sin(k * Math.PI / 3)].join(','))
  .join(' ');

const HEX_DOT_DISTANCE = SQRT3 / 2 * HEX_S * 0.8;  // center to each dot
const HEX_DOT_POSITIONS = [0, 1, 2, 3, 4, 5].map(d => [
  HEX_DOT_DISTANCE * Math.sin(d * Math.PI / 3),
  -HEX_DOT_DISTANCE * Math.cos(d * Math.PI / 3),
]);

function hexCenter({ q, r }) {
  return [1.5 * HEX_S * q, SQRT3 * HEX_S * (r + q / 2)];
}

// SVG viewBox string tightly enclosing the given cells, plus its width.
function hexViewBox(cells) {
  const centers = cells.map(hexCenter);
  const pad = 4;
  const minX = Math.min(...centers.map(c => c[0])) - HEX_S - pad;
  const maxX = Math.max(...centers.map(c => c[0])) + HEX_S + pad;
  const minY = Math.min(...centers.map(c => c[1])) - SQRT3 / 2 * HEX_S - pad;
  const maxY = Math.max(...centers.map(c => c[1])) + SQRT3 / 2 * HEX_S + pad;
  return { viewBox: `${minX} ${minY} ${maxX - minX} ${maxY - minY}`, width: maxX - minX };
}

// `onClick` omitted => purely decorative (used in the help example).
function HexCell({ cell, axle, free, label, onClick }) {
  const [cx, cy] = hexCenter(cell);
  const interactive = !!onClick;
  return (
    <g
      className={`hex ${free ? 'free' : 'blocked'}${interactive ? '' : ' static'}`}
      transform={`translate(${cx},${cy})`}
      {...(interactive ? {
        role: 'button',
        tabIndex: 0,
        'aria-label': label,
        onClick,
        onKeyDown: (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); }
        },
      } : { 'aria-hidden': true })}
    >
      <polygon points={HEX_POINTS} />
      <path className="arrow-shape" d={ARROW_UNIT_PATH} transform={`rotate(${axle.orientation * 60}) scale(${HEX_S})`} />
      {axle.blocks.map((blocked, d) =>
        blocked ? <circle key={d} className="hex-dot" cx={HEX_DOT_POSITIONS[d][0]} cy={HEX_DOT_POSITIONS[d][1]} r={3.5} /> : null
      )}
    </g>
  );
}

function HexBoardView({ board, onCellClick }) {
  const { viewBox, width } = hexViewBox(board.cells);
  return (
    <div id="hex-box">
      <svg viewBox={viewBox} style={{ maxWidth: Math.min(width * 1.4, 520) }}>
        {board.cells.map((cell, i) => {
          const free = board.canRotate(i);
          return (
            <HexCell
              key={i}
              cell={cell}
              axle={board.grid[i]}
              free={free}
              onClick={() => onCellClick(i)}
              label={`Cell ${i + 1}${free ? '' : ', blocked'}`}
            />
          );
        })}
      </svg>
    </div>
  );
}

// Two hexes: the upper-left one has a dot pointing at its lower-right neighbor.
const HELP_HEX_CELLS = [{ q: 0, r: 0 }, { q: 1, r: 0 }];
function HexHelpExample() {
  const { viewBox } = hexViewBox(HELP_HEX_CELLS);
  const blocker = new HexAxle(0, [false, false, true, false, false, false]);
  const blocked = new HexAxle(0, [false, false, false, false, false, false]);
  return (
    <svg viewBox={viewBox} aria-hidden="true">
      <HexCell cell={HELP_HEX_CELLS[0]} axle={blocker} free={true} />
      <HexCell cell={HELP_HEX_CELLS[1]} axle={blocked} free={false} />
    </svg>
  );
}

// Uses the native <dialog> element: showModal() gives us the backdrop, Esc to
// close, focus trapping, and focus restoration for free.
function HelpModal({ open, onClose, grid }) {
  const hex = grid === 'hex';
  const shape = hex ? 'hex' : 'square';
  const shapes = hex ? 'hexes' : 'squares';
  const dialogRef = useRef(null);

  useEffect(() => {
    const dialog = dialogRef.current;
    if (open && !dialog.open) {
      dialog.showModal();
    } else if (!open && dialog.open) {
      dialog.close();
    }
  }, [open]);

  return (
    <dialog
      id="help-modal"
      ref={dialogRef}
      aria-labelledby="help-title"
      onClose={onClose}
      // Clicks on the backdrop land on the <dialog> element itself.
      onClick={(e) => { if (e.target === dialogRef.current) onClose(); }}
    >
      <div className="modal-content">
        <div className="modal-header">
          <h2 id="help-title">How to play</h2>
          <button id="help-close" aria-label="Close help" onClick={onClose}>×</button>
        </div>

        <p className="help-goal">
          Turn every arrow so it points <strong>straight up</strong>.
        </p>

        <ul className="help-rules">
          <li>Tap a {shape} to rotate it {hex ? '60°' : '90°'} clockwise.</li>
          <li>
            A dot on a {shape}'s edge <strong>blocks</strong> the neighbor it
            points at. Blocked {shapes} (<span className="legend-swatch blocked"></span> grey)
            can't turn; free {shapes} (<span className="legend-swatch free"></span> green) can.
          </li>
          <li>Dots turn along with their {shape}, so turning one {shape} can free up — or block — others.</li>
          {hex
            ? <li>Harder modes just add more dots.</li>
            : <li>In <strong>Hard</strong> mode, corner dots block diagonal neighbors too.</li>}
        </ul>

        <div className="help-example">
          {hex ? (
            <HexHelpExample />
          ) : (
            <div className="axle-row" aria-hidden="true">
              <div className="axle-button axle-unblocked">
                <SquareArrow orientation={0} />
                <div className="dot dot-right"></div>
              </div>
              <div className="axle-button axle-blocked">
                <SquareArrow orientation={0} />
              </div>
            </div>
          )}
          <p>
            {hex
              ? 'The dot on the upper-left hex points at its lower-right neighbor, so that hex is stuck until the first one turns.'
              : 'The dot on the left square points at its right neighbor, so the right square is stuck until the left one turns.'}
          </p>
        </div>

        <button id="help-ok" onClick={onClose}>Got it</button>
      </div>
    </dialog>
  );
}

// ---------- App ----------

function AxleCell({ axle, free, onClick, label }) {
  return (
    <button
      className={`axle-button ${free ? 'axle-unblocked' : 'axle-blocked'}`}
      onClick={onClick}
      aria-label={label}
    >
      <SquareArrow orientation={axle.orientation} />
      {DIRECTION_INFO.map(([name], d) =>
        axle.blocksDirection(d) ? <div key={name} className={`dot dot-${name}`}></div> : null
      )}
    </button>
  );
}

const MODES = [
  ['easy', 'Easy'],
  ['normal', 'Normal'],
  ['hard', 'Hard'],
];

const GRIDS = [
  ['square', 'Square'],
  ['hex', 'Hex'],
];

function SizeControl({ label, value, min, max, onChange, suffix }) {
  const noun = label.toLowerCase();
  return (
    <div className="input-group">
      <span>{label}:</span>
      <button className="size-button" aria-label={`Decrease ${noun}`}
              disabled={value <= min} onClick={() => onChange(value - 1)}>-</button>
      <input type="number" value={value} min={min} max={max} readOnly aria-label={label} />
      <button className="size-button" aria-label={`Increase ${noun}`}
              disabled={value >= max} onClick={() => onChange(value + 1)}>+</button>
      {suffix && <span className="cell-count">{suffix}</span>}
    </div>
  );
}

const App = () => {
  const [grid, setGrid] = useState('square');
  const [mode, setMode] = useState('normal');
  const [rows, setRows] = useState(4);
  const [cols, setCols] = useState(4);
  const [radius, setRadius] = useState(DEFAULT_RADIUS);
  // Lazy initializer: without the arrow, a whole new puzzle was generated (and
  // thrown away) on every render.
  const [puzzleState, setPuzzleState] = useState(() => generateRandomState(4, 4, 'normal'));
  const [message, setMessage] = useState("");
  // Show the help on a player's first visit. The flag is written as soon as the
  // modal is shown, so a reload doesn't nag. If storage is unavailable (private
  // browsing etc.) we skip the auto-show rather than show it on every load.
  const [helpOpen, setHelpOpen] = useState(() => {
    try {
      if (localStorage.getItem(HELP_SEEN_KEY)) return false;
      localStorage.setItem(HELP_SEEN_KEY, '1');
      return true;
    } catch (e) {
      return false;
    }
  });

  // Starts a new game, optionally changing one or more settings.
  const startNewGame = (changes = {}) => {
    const next = { grid, mode, rows, cols, radius, ...changes };
    setGrid(next.grid);
    setMode(next.mode);
    setRows(next.rows);
    setCols(next.cols);
    setRadius(next.radius);
    setPuzzleState(next.grid === 'hex'
      ? generateHexState(next.radius, next.mode)
      : generateRandomState(next.rows, next.cols, next.mode));
    setMessage("New Game Started!");
  };

  const applyMove = (newState) => {
    setPuzzleState(newState);
    setMessage(newState.isSolved() ? "You Win!" : "");
  };

  const handleAxleClick = (r, c) => {
    const newState = puzzleState.clone();
    if (newState.canRotate(r, c)) {
      newState.setAxle(r, c, newState.getAxle(r, c).rotatedClockwise());
      applyMove(newState);
    } else {
      setMessage("Cannot Rotate Axle");
    }
  };

  const handleHexClick = (i) => {
    const newState = puzzleState.clone();
    if (newState.canRotate(i)) {
      newState.grid[i] = newState.grid[i].rotatedClockwise();
      applyMove(newState);
    } else {
      setMessage("Cannot Rotate Axle");
    }
  };

  const closeHelp = () => setHelpOpen(false);

  return (
    <div>
      <div id="header">
        <h1>Axle Puzzle</h1>
        <button id="help-button" aria-label="How to play" onClick={() => setHelpOpen(true)}>?</button>
      </div>
      <div id="mode-selection">
        {MODES.map(([m, label]) => (
          <button
            key={m}
            className={m === mode ? 'selected' : ''}
            aria-pressed={m === mode}
            onClick={() => startNewGame({ mode: m })}
          >
            {label}
          </button>
        ))}
      </div>
      <div id="grid-selection" role="group" aria-label="Board shape">
        <span className="label">Board:</span>
        {GRIDS.map(([g, label]) => (
          <button
            key={g}
            className={g === grid ? 'selected' : ''}
            aria-pressed={g === grid}
            onClick={() => { if (g !== grid) startNewGame({ grid: g }); }}
          >
            {label}
          </button>
        ))}
      </div>
      <div id="row-col-inputs">
        {grid === 'hex' ? (
          <SizeControl label="Size" value={radius} min={MIN_RADIUS} max={MAX_RADIUS}
                       suffix={`${hexCellCount(radius)} cells`}
                       onChange={(n) => startNewGame({ radius: n })} />
        ) : (
          <>
            <SizeControl label="Rows" value={rows} min={MIN_SIZE} max={MAX_SIZE}
                         onChange={(n) => startNewGame({ rows: n })} />
            <SizeControl label="Cols" value={cols} min={MIN_SIZE} max={MAX_SIZE}
                         onChange={(n) => startNewGame({ cols: n })} />
          </>
        )}
      </div>
      {puzzleState instanceof HexBoard ? (
        <HexBoardView board={puzzleState} onCellClick={handleHexClick} />
      ) : (
        <div id="puzzle-box" style={{ '--cols': puzzleState.cols }}>
          {Array.from({ length: puzzleState.rows }, (_, r) => (
            <div className="axle-row" key={r}>
              {Array.from({ length: puzzleState.cols }, (_, c) => {
                const free = puzzleState.canRotate(r, c);
                return (
                  <AxleCell
                    key={c}
                    axle={puzzleState.getAxle(r, c)}
                    free={free}
                    onClick={() => handleAxleClick(r, c)}
                    label={`Row ${r + 1}, column ${c + 1}${free ? '' : ', blocked'}`}
                  />
                );
              })}
            </div>
          ))}
        </div>
      )}
      <div id="message-box" role="status" aria-live="polite">{message}</div>
      <div id="game-controls">
        <button id="new-game-button" onClick={() => startNewGame()}>New Game</button>
      </div>
      <div id="footer">
          Designed by <a href="https://joshmermelstein.com">Josh Mermelstein</a>, Coding by Gemini
      </div>
      <HelpModal open={helpOpen} onClose={closeHelp} grid={grid} />
    </div>
  );
};

createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
